name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the current one to finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to VPS
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Pull, build, publish and restart relay
        uses: appleboy/ssh-action@v1
        env:
          APP_DIR: /home/dafinmaulana/runeverra
          NODE_BIN: /home/dafinmaulana/.nvm/versions/node/v24.21.0/bin
          COMMIT: ${{ github.sha }}
          WS_URL: wss://runeverra.daffi.my.id/ws
          WEBROOT: /var/www/runeverra
          RELAY_DIR: /opt/runeverra
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: APP_DIR,NODE_BIN,COMMIT,WS_URL,WEBROOT,RELAY_DIR
          command_timeout: 15m
          script: |
            set -euo pipefail
            export PATH="$NODE_BIN:$PATH"

            cd "$APP_DIR"

            echo "::group::Checkout $COMMIT"
            git checkout main
            git fetch --prune origin main
            git merge --ff-only "$COMMIT"
            echo "::endgroup::"

            echo "::group::Install dependencies"
            npm ci
            echo "::endgroup::"

            # The client bakes the relay URL in at build time.
            echo "::group::Build"
            VITE_WS_URL="$WS_URL" npm run build
            echo "::endgroup::"

            echo "::group::Publish static site"
            sudo rsync -a --delete dist/ "$WEBROOT/"
            echo "::endgroup::"

            # The relay runs from a root-owned copy as the unprivileged runeverra user.
            echo "::group::Update relay"
            sudo rsync -a --delete --exclude node_modules --exclude dist --exclude .git ./ "$RELAY_DIR/"
            (cd "$RELAY_DIR" && sudo env "PATH=$PATH" npm ci --omit=dev)
            sudo chmod -R a+rX "$RELAY_DIR"
            echo "::endgroup::"

            # Restarting drops in-memory rooms; players reconnect and rejoin.
            sudo systemctl restart runeverra-ws
            sleep 1
            systemctl is-active runeverra-ws
